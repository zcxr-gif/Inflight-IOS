include:
  - project.yml

targets:
  InflightUIProbe:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UIProbe
    dependencies:
      - target: InflightTracker
    settings:
      base:
        TEST_TARGET_NAME: InflightTracker
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.Inflight.uiprobe
        CODE_SIGN_STYLE: Automatic

schemes:
  InflightProbe:
    build:
      targets:
        InflightTracker: all
        InflightUIProbe: [test]
    test:
      config: Debug
      targets:
        - InflightUIProbe
      environmentVariables:
        PROBE_OUT: /tmp/probe
