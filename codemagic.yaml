workflows:
  ios-native-workflow:
    name: iOS Native Build

    integrations:
      app_store_connect: Codemagic CI/CD

    environment:
      xcode: latest

      # MANUAL SIGNING
      #
      # Was automatic — `distribution_type: app_store` with a bundle id, which
      # has Codemagic fetch and create signing files through the App Store
      # Connect API. It cost a day. Codemagic also keeps its own uploaded
      # profiles, installs them on every builder, and those copies shadow the
      # fetch completely: portal edits had no effect, a deleted profile kept
      # arriving, a new one never did, and every error pointed at the portal,
      # which was correct all along and simply not being read.
      #
      # Named files remove the guesswork. What signs the build is what was
      # uploaded, and nothing decides anything on our behalf.
      #
      # These are Codemagic *reference names*, set when each file is uploaded
      # under Team settings -> Code signing identities. They are not filenames
      # and not the profile names in Apple's portal, though keeping all three
      # spellings identical is the cheapest way to stay sane:
      #
      #   inflight_distribution          App Store profile, com.tracker.Inflight
      #   inflight_widgets_distribution  App Store profile, com.tracker.Inflight.widgets
      #   inflight_distribution_cert     the Apple Distribution certificate, as
      #                                  a .p12 carrying its private key
      #
      # Both profiles are listed because the extension is a second bundle with
      # its own App ID; one profile cannot sign both. See NOTIFICATIONS.md.
      ios_signing:
        provisioning_profiles:
          - inflight_distribution
          - inflight_widgets_distribution
        certificates:
          - inflight_distribution_cert

      vars:
        XCODE_PROJECT_DIR: "ios-native"
        XCODE_PROJECT: "InflightTracker.xcodeproj"
        XCODE_SCHEME: "InflightTracker"
        HOMEBREW_NO_AUTO_UPDATE: 1

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail

          # The Xcode project is generated from ios-native/project.yml instead
          # of being committed, so the repo stays editable without a Mac.
          if command -v xcodegen > /dev/null 2>&1; then
            echo "==> xcodegen already installed: $(xcodegen --version)"
            exit 0
          fi

          echo "==> Installing xcodegen via Homebrew"
          if brew install xcodegen; then
            echo "==> Installed: $(xcodegen --version)"
            exit 0
          fi

          # Fallback: pull the prebuilt binary straight from GitHub releases so
          # a Homebrew outage doesn't break the build.
          echo "==> Homebrew failed, falling back to the released binary"
          curl -fsSL -o /tmp/xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -oq /tmp/xcodegen.zip -d /tmp/xcodegen
          # The binary resolves its setting presets at ../share/xcodegen, so
          # bin/ and share/ have to keep their relative layout.
          sudo mkdir -p /usr/local/bin /usr/local/share
          sudo cp -R /tmp/xcodegen/bin/* /usr/local/bin/
          sudo cp -R /tmp/xcodegen/share/* /usr/local/share/
          xcodegen --version

      - name: Generate Xcode Project
        script: |
          set -euo pipefail

          cd "$XCODE_PROJECT_DIR"
          xcodegen generate --spec project.yml

          # Nothing below can succeed if generation quietly produced the wrong
          # thing, so fail here rather than deep inside xcodebuild.
          echo "==> Verifying generated project"
          if [ ! -d "$XCODE_PROJECT" ]; then
            echo "FATAL: $XCODE_PROJECT was not generated."
            exit 1
          fi

          SCHEME_PATH="$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          if [ ! -f "$SCHEME_PATH" ]; then
            echo "FATAL: shared scheme $XCODE_SCHEME is missing at $SCHEME_PATH."
            ls -R "$XCODE_PROJECT/xcshareddata" || true
            exit 1
          fi

          # The live map is useless without the Socket.IO client, and a missing
          # package reference shows up as confusing 'no such module' errors.
          if ! grep -q 'socket.io-client-swift' "$XCODE_PROJECT/project.pbxproj"; then
            echo "FATAL: SocketIO package reference missing from project.pbxproj."
            exit 1
          fi

          # The icons and airport table are loose bundle resources; if they miss
          # the copy phase, aircraft render without icons and every route card
          # comes up blank — at runtime, with no build error to explain it.
          for RESOURCE in markers.png sprite-uvs.json airports.txt; do
            if ! grep -q "$RESOURCE" "$XCODE_PROJECT/project.pbxproj"; then
              echo "FATAL: $RESOURCE is not part of the app target."
              exit 1
            fi
          done

          # The widget extension has to be generated AND embedded. An extension
          # that builds but isn't embedded produces a perfectly successful
          # build with no widgets in the gallery and no Live Activity — the
          # failure is entirely invisible until someone installs the build and
          # goes looking for a tile that was never in the .ipa.
          if ! grep -q 'InflightWidgets.appex' "$XCODE_PROJECT/project.pbxproj"; then
            echo "FATAL: the InflightWidgets extension is missing from the project."
            exit 1
          fi
          # dstSubfolderSpec 13 is PlugIns — the copy phase that actually puts
          # the .appex inside the .app. Matched on the spec rather than the
          # phase's name, which Xcode has renamed between versions.
          if ! grep -q 'dstSubfolderSpec = 13' "$XCODE_PROJECT/project.pbxproj"; then
            echo "FATAL: InflightWidgets is not embedded in the app."
            exit 1
          fi

          # Both targets need the app group, and they need the SAME one: the
          # widgets read the flight the app wrote, so a mismatch renders the
          # empty state forever without erroring anywhere.
          for ENTITLEMENTS in Support/InflightTracker.entitlements Support/InflightWidgets.entitlements; do
            if ! grep -q 'group.com.tracker.Inflight' "$ENTITLEMENTS"; then
              echo "FATAL: $ENTITLEMENTS is missing the shared app group."
              exit 1
            fi
          done

          # Both bundles need a privacy manifest, and it has to be copied
          # rather than compiled. Missing one does not fail the build: the
          # upload succeeds, TestFlight shows the build, and an ITMS-91053
          # email arrives afterwards saying it cannot be distributed. That is
          # an hour of round trip to learn something checkable here.
          if [ "$(grep -c 'PrivacyInfo.xcprivacy' "$XCODE_PROJECT/project.pbxproj")" -lt 2 ]; then
            echo "FATAL: a privacy manifest is missing from the project."
            echo "Expected one for each of the app and the widget extension."
            exit 1
          fi

          # The manifests are declarations about code that keeps changing, so
          # they are worth reading rather than merely counting. Every UserDefaults
          # suite in the app is the app group's or its own; both reasons must be
          # claimed.
          for REASON in CA92.1 1C8F.1 C617.1; do
            if ! grep -q "$REASON" Support/Privacy/App/PrivacyInfo.xcprivacy; then
              echo "FATAL: the app's privacy manifest does not claim $REASON."
              exit 1
            fi
          done

          echo "==> Project generated and verified"

      - name: Resolve Swift Packages
        script: |
          set -euo pipefail

          cd "$XCODE_PROJECT_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Increment Build Number
        script: |
          set -euo pipefail

          # Keeps the Xcode build number in step with the Codemagic build id,
          # which is what stops TestFlight rejecting duplicate versions.
          cd "$XCODE_PROJECT_DIR"

          # The Capacitor app reached build 199. App Store Connect rejects an
          # upload whose build number isn't above what it already has, so if
          # Codemagic's counter ever restarts (new app set up there, project
          # recreated) uploads would start failing for a non-obvious reason.
          # Offsetting past the legacy high-water mark keeps it monotonic.
          LEGACY_HIGH_WATER_MARK=199
          EFFECTIVE_BUILD_NUMBER="$BUILD_NUMBER"
          if [ "$EFFECTIVE_BUILD_NUMBER" -le "$LEGACY_HIGH_WATER_MARK" ]; then
            EFFECTIVE_BUILD_NUMBER=$(( LEGACY_HIGH_WATER_MARK + BUILD_NUMBER ))
            echo "Codemagic build number $BUILD_NUMBER is at or below the legacy" \
                 "high-water mark; using $EFFECTIVE_BUILD_NUMBER instead."
          fi

          echo "Updating build version to $EFFECTIVE_BUILD_NUMBER"
          agvtool new-version -all "$EFFECTIVE_BUILD_NUMBER"

      - name: iOS Code Signing
        script: |
          set -euo pipefail

          # The ios_signing block above has already fetched the distribution
          # certificate and the App Store profiles for every App ID starting
          # with com.tracker.Inflight — which is how the widget extension's
          # profile is meant to arrive alongside the app's.
          cd "$XCODE_PROJECT_DIR"

          # There is deliberately no attempt to register the extension's App ID
          # from here. `fetch-signing-files --create` looked like the answer,
          # but it fetches certificates as well as profiles and fails with
          # "Cannot save Signing Certificates without certificate private key"
          # under managed signing, where the key belongs to Codemagic and is
          # never exported. Worse, even a working version could not finish the
          # job: the App Store Connect API cannot attach an app group to an
          # identifier, so a freshly created App ID would come back without the
          # one capability the extension needs, and the profile issued against
          # it would be wrong from birth.
          #
          # So the App ID is a portal action, and this step's job is to say so
          # precisely — xcodebuild's own version of the error names neither the
          # App ID nor the capability, and only appears once the archive is
          # nearly done.

          # What Apple itself reports, alongside what was actually installed.
          #
          # Under manual signing the installed profiles come from Codemagic's
          # storage rather than from Apple, so these two lists are genuinely
          # independent — which is the point. An uploaded profile that Apple has
          # since invalidated still installs happily and still fails to sign, and
          # the only way to see that is to read both.
          echo "==> Identifiers Apple reports for this API key"
          app-store-connect bundle-ids list || \
            echo "    (could not list — the App Store Connect key may be scoped elsewhere)"

          echo "==> Profiles Apple reports for this API key"
          app-store-connect profiles list || \
            echo "    (could not list)"
          python3 Scripts/check-provisioning.py \
            --require "com.tracker.Inflight:com.apple.security.application-groups=group.com.tracker.Inflight" \
            --require "com.tracker.Inflight:aps-environment" \
            --require "com.tracker.Inflight.widgets:com.apple.security.application-groups=group.com.tracker.Inflight"

          # Applies the profiles to the freshly generated project and writes the
          # export options plist where build-ipa expects to find it.
          xcode-project use-profiles \
            --project "$XCODE_PROJECT" \
            --export-options-plist "$HOME/export_options.plist"

          # use-profiles reports success as long as it matched *something*, so
          # a target it skipped goes unmentioned. Confirm both came away with a
          # profile — the extension is the one that historically did not.
          for TARGET in InflightTracker InflightWidgets; do
            SPECIFIER=$(xcodebuild -project "$XCODE_PROJECT" \
              -target "$TARGET" \
              -configuration Release \
              -showBuildSettings 2>/dev/null \
              | awk -F' = ' '/ PROVISIONING_PROFILE_SPECIFIER = /{print $2; exit}')
            if [ -z "${SPECIFIER:-}" ]; then
              echo "FATAL: no provisioning profile was applied to $TARGET."
              exit 1
            fi
            echo "==> $TARGET signs with: $SPECIFIER"
          done

      - name: Build IPA (Signed)
        script: |
          set -euo pipefail

          cd "$XCODE_PROJECT_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config "Release"

    artifacts:
      - "ios-native/build/ios/ipa/*.ipa"
      - "build/ios/ipa/*.ipa"
      - "*.ipa"
      - "/tmp/xcodebuild_logs/*.log"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
