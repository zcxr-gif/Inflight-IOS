workflows:
  ios-workflow:
    name: iOS Build
    
    integrations:
      app_store_connect: Personal

    environment:
      xcode: latest
      node: latest
      cocoapods: default
      # NOTE: the `ios_signing` block is intentionally NOT set here. It
      # only fetches signing files for a single bundle id, and the way
      # it manages the distribution certificate's private key is opaque
      # — when we later run a second `app-store-connect fetch-signing-files`
      # for the widget extension's bundle id, that call can't find the
      # key on disk and dies with
      # "Cannot save Signing Certificates without certificate private key".
      # Instead we manage the whole signing pipeline manually in the
      # "iOS Code Signing" script step below: a single `keychain init`,
      # one `fetch-signing-files` per bundle id (main app + widget),
      # then `keychain add-certificates` and `xcode-project use-profiles`.
      # Both fetches share the same on-disk cert+key, so the second one
      # reuses what the first created.
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
          
    scripts:
      - name: Install Dependencies
        script: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      
      - name: Initialize iOS Platform
        script: |
          # Clean restart of ios folder
          rm -rf ios
          npx cap add ios

          # Generate iOS app icons from assets/icon-only.png into the freshly
          # created ios/ project. Must run after `cap add ios` so the
          # Assets.xcassets target exists, and before `cap sync` so the
          # generated icons get bundled into the final web sync.
          npx @capacitor/assets generate --ios

          npx cap sync

          # Inject the Live Activity widget extension into the freshly
          # generated Xcode project. Idempotent. Source of truth for the
          # Swift / plist files lives in native-ios/ at the repo root.
          gem list -i xcodeproj > /dev/null 2>&1 || sudo gem install xcodeproj
          gem list -i plist > /dev/null 2>&1 || sudo gem install plist
          ruby native-ios/inject_live_activity.rb

          # Check for Podfile to decide on Pods vs SPM
          cd ios/App
          if [ -f "Podfile" ]; then
            echo "Podfile found. Installing Pods..."
            pod install
          else
            echo "No Podfile found. Skipping CocoaPods (using SPM)."
          fi

      - name: Increment Build Number
        script: |
          # Automatically syncs Xcode build number with Codemagic Build ID
          # preventing "Duplicate Version" errors in TestFlight.
          cd ios/App
          echo "Updating build version to $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER

      - name: iOS Code Signing
        script: |
          # Fail loud on any error so problems surface here instead of
          # later inside xcodebuild as a cryptic
          # "InflightLiveActivity requires a provisioning profile".
          set -euo pipefail

          # Fresh build keychain. The fetch-signing-files calls below
          # write the distribution certificate's .p12 (and its private
          # key) into a default on-disk location; `keychain
          # add-certificates` afterwards loads them into this keychain.
          keychain initialize

          # Fetch / create signing files for the main app. The first
          # fetch creates the distribution certificate + private key
          # and saves them to disk.
          app-store-connect fetch-signing-files com.tracker.Inflight \
            --platform IOS \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --verbose

          # Fetch / create signing files for the Live Activity widget
          # extension. This reuses the cert + private key that the
          # previous call just saved to disk, which is exactly why we
          # do BOTH fetches manually in one script instead of letting
          # the `ios_signing` environment block do the first one — that
          # block hides the private key, and this second call would
          # then fail with
          # "Cannot save Signing Certificates without certificate private key".
          app-store-connect fetch-signing-files com.tracker.Inflight.LiveActivity \
            --platform IOS \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --verbose

          # Load fetched certs into the build keychain so codesign can
          # find them during archive.
          keychain add-certificates

          cd ios/App
          # Write PROVISIONING_PROFILE_SPECIFIER into each target's
          # build settings, matching profiles to targets by bundle id.
          xcode-project use-profiles --verbose

          # Verify the widget target actually got a profile assigned.
          # If this is empty, xcodebuild later fails with "requires a
          # provisioning profile" — surface the root cause here.
          WIDGET_PROFILE=$(xcodebuild -project App.xcodeproj \
            -showBuildSettings -target InflightLiveActivity \
            -configuration Release 2>/dev/null \
            | awk -F' = ' '/PROVISIONING_PROFILE_SPECIFIER/ {print $2; exit}')
          if [ -z "$WIDGET_PROFILE" ]; then
            echo ""
            echo "ERROR: InflightLiveActivity target has no PROVISIONING_PROFILE_SPECIFIER after use-profiles."
            echo "This means app-store-connect could not fetch/create a profile for"
            echo "com.tracker.Inflight.LiveActivity. Most common cause: the Codemagic"
            echo "App Store Connect API key lost its Admin (or App Manager) role —"
            echo "re-check the integration under Codemagic Team Settings > Integrations."
            exit 1
          fi
          echo "InflightLiveActivity provisioning profile: $WIDGET_PROFILE"

      - name: Build IPA (Signed)
        script: |
          cd ios/App
          
          # Check if a Workspace exists (created by CocoaPods) or just a Project
          if [ -d "App.xcworkspace" ]; then
            echo "Detailed Build: Detected App.xcworkspace. Building Workspace."
            
            xcode-project build-ipa \
              --workspace "App.xcworkspace" \
              --scheme "App" \
              --config "Release"
              
          else
            echo "Detailed Build: No Workspace found. Building App.xcodeproj."
            
            xcode-project build-ipa \
              --project "App.xcodeproj" \
              --scheme "App" \
              --config "Release"
          fi

    artifacts:
      - "ios/App/build/ios/ipa/*.ipa" # <--- FIXED: Locates the file correctly
      - "build/ios/ipa/*.ipa"
      - "*.ipa"
      - "/tmp/xcodebuild_logs/*.log"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true