# Diagnostic only: runs the app in a simulator at a few commits and records
# what it shows and which controls answer. Removed before merging.
name: UI probe

on:
  push:
    branches:
      - 'claude/fix-buttons-planes'
  workflow_dispatch:

concurrency:
  group: ui-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before-164
            ref: 9b1c804744a7420effc497ff264aaeed035d2b38
          - name: after-164
            ref: c5dac3be53295218185323f3c130d46060389321
          - name: branch
            ref: ''

    steps:
      - uses: actions/checkout@v4
        with:
          path: probe

      - uses: actions/checkout@v4
        with:
          path: app
          ref: ${{ matrix.ref || github.sha }}
          fetch-depth: 0

      - name: Pick the newest Xcode
        run: |
          newest=$(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project with the probe
        working-directory: app/ios-native
        run: |
          cp -R ../../probe/tools/uiprobe/UIProbe UIProbe
          cp ../../probe/tools/uiprobe/ui-probe.yml ui-probe.yml
          xcodegen generate --spec ui-probe.yml

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]:
                      best=(rt,x["udid"],x["name"])
          print(best[1]); print(best, file=sys.stderr)')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true

      - name: Run the probe
        working-directory: app/ios-native
        env:
          TEST_RUNNER_PROBE_OUT: /tmp/probe
        run: |
          mkdir -p /tmp/probe
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log stream --level debug --style compact \
            --predicate 'process == "Inflight"' > /tmp/probe/app-log.txt 2>&1 &
          set -o pipefail
          xcodebuild test \
            -project InflightTracker.xcodeproj \
            -scheme InflightProbe \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath /tmp/probe/result.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee /tmp/probe/build.log | grep -E "PROBE:|error:|Test Case|\*\*" || true
          xcrun xcresulttool export attachments --path /tmp/probe/result.xcresult --output-path /tmp/probe/attachments || true
          ls -la /tmp/probe /tmp/probe/attachments || true
          tail -c 20000 /tmp/probe/app-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: |
            /tmp/probe/*.png
            /tmp/probe/*.txt
            /tmp/probe/attachments
