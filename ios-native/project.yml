name: InflightTracker

# The .xcodeproj is generated by XcodeGen in CI (see codemagic.yaml) rather
# than committed. Nothing here needs a Mac to edit — this file is the project.

options:
  bundleIdPrefix: com.tracker
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.1"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  InflightTracker:
    type: application
    platform: iOS

    sources:
      - path: InflightTracker

    dependencies:
      - package: SocketIO
        product: SocketIO

    settings:
      base:
        PRODUCT_NAME: Inflight
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.Inflight
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_BITCODE: NO

schemes:
  InflightTracker:
    build:
      targets:
        InflightTracker: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
