name: InflightTracker

# The .xcodeproj is generated by XcodeGen in CI (see codemagic.yaml) rather
# than committed. Nothing here needs a Mac to edit — this file is the project.

options:
  bundleIdPrefix: com.tracker
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.1"

settings:
  base:
    # Must stay above the Capacitor build's 1.0. TestFlight groups builds by
    # this string and iOS only offers an update when it actually increases —
    # 1.0.0 reads as equal to 1.0, so testers never saw an update prompt.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    # Current OS only. Everything the app uses — Liquid Glass chrome, the
    # sheet background APIs, the modern onChange — is available unguarded at
    # this floor, and the CI toolchain is pinned to `xcode: latest`.
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  InflightTracker:
    type: application
    platform: iOS

    sources:
      # Sweeps in InflightTracker/Shared, which the widget extension compiles
      # too — see the note on that target.
      - path: InflightTracker
      # Apple fixes both the name and the location — it has to be called
      # PrivacyInfo.xcprivacy and sit at the root of the bundle — so each
      # target's copy gets a directory of its own rather than the Info.plist
      # treatment of a prefixed filename. Declared explicitly so it is a
      # resource rather than whatever XcodeGen infers an unknown extension to be.
      - path: Support/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources

    dependencies:
      - package: SocketIO
        product: SocketIO
      - target: InflightWidgets
        embed: true

    settings:
      base:
        PRODUCT_NAME: Inflight
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.Inflight
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/InflightTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_BITCODE: NO

  # Home-screen widgets, lock-screen accessories and the Live Activity.
  #
  # The shared sources are compiled into both targets rather than split into a
  # framework: it is four small files with no dependencies of their own, and an
  # embedded framework costs the widget launch time it does not have — a widget
  # that misses its render budget is a blank tile.
  InflightWidgets:
    type: app-extension
    platform: iOS

    sources:
      - path: InflightWidgets
      - path: InflightTracker/Shared
      - path: Support/Privacy/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: InflightWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.tracker.Inflight.widgets
        INFOPLIST_FILE: Support/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/InflightWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_BITCODE: NO
        SKIP_INSTALL: YES

schemes:
  InflightTracker:
    build:
      targets:
        InflightTracker: all
        InflightWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
